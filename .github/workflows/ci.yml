name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: seatwise
          POSTGRES_PASSWORD: seatwise
          POSTGRES_DB: seatwise_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U seatwise -d seatwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://seatwise:seatwise@localhost:5433/seatwise_test?schema=public&connection_limit=30
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_ROUNDS: 10
      WEB_ORIGIN: http://localhost:5173
      REDIS_URL: redis://localhost:6379
      RESTAURANT_OPEN_HOUR: 11
      RESTAURANT_CLOSE_HOUR: 23
      SLOT_MINUTES: 30
      DINING_DURATION_MINUTES: 90
      MAX_ADVANCE_BOOKING_DAYS: 90
      MIN_LEAD_TIME_MINUTES: 0
      MAX_PARTY_SIZE: 10
      RESTAURANT_UTC_OFFSET_MINUTES: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Prisma generate + migrate
        run: |
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Unit tests
        run: npm test

      - name: Web tests
        run: npm run test:web

      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Build web
        run: npm run build
