# Render Blueprint — creates the SeatWise API service in one step.
# Render dashboard → New → Blueprint → pick this repo. It then asks only for the
# values marked `sync: false` below.
services:
  - type: web
    name: seatwise-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      # Random secret generated by Render — never typed or stored in git.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Vercel rewrite + Render's own proxy. Check the logs show visitor IPs.
      - key: TRUST_PROXY_HOPS
        value: 2
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 20
      # Asked for when the Blueprint is created:
      - key: DATABASE_URL # Neon connection string, ending ?sslmode=require
        sync: false
      - key: WEB_ORIGIN # your Vercel URL, e.g. https://seatwise.vercel.app
        sync: false
      - key: OPENAI_API_KEY # leave empty to run without Ask AI
        sync: false
      - key: RESEND_API_KEY # leave empty to skip emails
        sync: false
