<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TastyFood — book a table in seconds. Authentic flavors from around the world, all in one place."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect before the font request so DNS + TLS overlap with HTML parse.
         The legacy pages loaded Poppins twice: once via a render-blocking
         @import at the top of style.css and again via a <link>. One load, here. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome. `defer` matters: the legacy pages loaded this kit
         synchronously in <head>, which blocked rendering on all three pages
         (audit #25). Icons are decorative here, so they can arrive late. -->
    <script
      src="https://kit.fontawesome.com/6db594b4a8.js"
      crossorigin="anonymous"
      defer
    ></script>

    <title>TastyFood — Premium Food &amp; Dining</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
