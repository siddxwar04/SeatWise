<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="SeatWise">
  <title>SeatWise</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6357f5" />
      <stop offset="1" stop-color="#4034bb" />
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#g)" />
  <!-- A table from above with four seats — one left hollow. That empty seat is
       the no-show the product exists to prevent. -->
  <g fill="#fff">
    <circle cx="20" cy="20" r="7.5" />
    <circle cx="20" cy="7" r="3.4" />
    <circle cx="33" cy="20" r="3.4" />
    <circle cx="20" cy="33" r="3.4" />
  </g>
  <circle cx="7" cy="20" r="3.4" fill="none" stroke="#fff" stroke-width="2.2" opacity=".85" />
</svg>
