<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">SeatWise architecture</title>
  <desc id="desc">Browser React Vite app talks to Express through an /api proxy. Express layers routes, controllers, services, and Prisma. PostgreSQL with pgvector and optional Redis sit behind the API. OpenAI supplies embeddings and gpt-4o-mini for the RAG concierge.</desc>
  <rect width="1080" height="420" fill="#0f172a"/>
  <text x="40" y="42" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">SeatWise runtime</text>
  <text x="40" y="66" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Diner browser ’ proxy ’ Express ’ Postgres / Redis ’ OpenAI</text>

  <!-- Browser -->
  <rect x="40" y="110" width="180" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="158" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Browser</text>
  <text x="130" y="182" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">React + Vite</text>
  <text x="130" y="204" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">SPA · diner + owner</text>

  <!-- Proxy -->
  <rect x="260" y="140" width="150" height="60" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="335" y="166" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">/api proxy</text>
  <text x="335" y="186" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Vite dev server</text>

  <!-- Express -->
  <rect x="450" y="90" width="250" height="250" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="575" y="122" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Express API</text>
  <rect x="475" y="142" width="200" height="36" rx="8" fill="#0f172a"/>
  <text x="575" y="165" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">routes</text>
  <rect x="475" y="188" width="200" height="36" rx="8" fill="#0f172a"/>
  <text x="575" y="211" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">controllers</text>
  <rect x="475" y="234" width="200" height="36" rx="8" fill="#0f172a"/>
  <text x="575" y="257" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">services</text>
  <rect x="475" y="280" width="200" height="36" rx="8" fill="#0f172a"/>
  <text x="575" y="303" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Prisma</text>

  <!-- Datastores -->
  <rect x="750" y="90" width="290" height="110" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="895" y="132" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">PostgreSQL 16</text>
  <text x="895" y="156" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">pgvector · bookings · embeddings</text>
  <text x="895" y="176" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">exclusion constraints · FOR UPDATE</text>

  <rect x="750" y="220" width="290" height="70" rx="14" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
  <text x="895" y="250" text-anchor="middle" fill="#fda4af" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Redis</text>
  <text x="895" y="272" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">optional cache + rate limits</text>

  <!-- OpenAI -->
  <rect x="750" y="310" width="290" height="70" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="895" y="340" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">OpenAI</text>
  <text x="895" y="362" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">embeddings + gpt-4o-mini</text>

  <!-- arrows -->
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
    </defs>
    <path d="M220 170 H260"/>
    <path d="M410 170 H450"/>
    <path d="M700 145 H750"/>
    <path d="M700 255 H750"/>
    <path d="M700 330 H750"/>
  </g>
</svg>
